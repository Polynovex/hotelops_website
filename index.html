<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The brand mark, not Vite's default. Sizes declared so the browser tab,
         a bookmark and an iOS home-screen shortcut all get the right one. -->
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HotelOpX — Hotel Management Software for Nigerian Hotels</title>
    <meta name="description" content="Modern hotel management platform for Nigerian hotels with PMS, POS, and Finance systems." />
    <meta property="og:title" content="HotelOpX — Hotel Management Software for Nigerian Hotels" />
    <meta property="og:description" content="Modern hotel management platform designed for Nigerian hotels." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HotelOpX" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.hotelopx.com/" />
    <meta property="og:image" content="https://www.hotelopx.com/logo.png" />
    <meta name="twitter:description" content="Property management, point of sale, housekeeping, finance and staff in one platform. Built for Nigerian hotels." />
    <meta name="theme-color" content="#0f172a" />
    <link rel="canonical" href="https://www.hotelopx.com/" />

    <!--
      Structured data, so a search result and a link preview carry the product,
      the price and the Lagos address rather than a bare domain.
    -->
    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"SoftwareApplication","name":"HotelOpX",
      "applicationCategory":"BusinessApplication","operatingSystem":"Web, Android, iOS",
      "url":"https://www.hotelopx.com","description":"Hotel management software for Nigerian hotels covering property management, point of sale, housekeeping, finance and staff.",
      "offers":{"@type":"Offer","price":"25000","priceCurrency":"NGN"},
      "publisher":{"@type":"Organization","name":"HotelOpX","url":"https://www.hotelopx.com","logo":"https://www.hotelopx.com/logo.png","email":"info@hotelopx.com","telephone":"+2348134393554",
      "address":{"@type":"PostalAddress","streetAddress":"20 Samera St, Ketu","addressLocality":"Lagos","postalCode":"105102","addressCountry":"NG"}}}
    </script>

    <style>html, body { margin: 0; }</style>
  </head>
  <body>
    <!--
      Left empty here: scripts/prerender.mjs renders each page into its own
      file at build time (title, description, canonical and content), and the
      browser hydrates that HTML in place.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
